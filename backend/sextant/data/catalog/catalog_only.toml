# Catalog-only sources. They appear in the Data Sources catalog and the coverage matrix so the
# investigator knows they exist. Either they have no publicly documented API (enterprise contracts),
# or they are deliberately excluded by policy. No implementation, and nothing is faked: their status is
# "Connector interface only — contact provider", "Retired" or "Excluded by policy".
#
# Implementing one later is structurally identical to any other connector: write a Connector with
# the same `name` and it replaces the catalog entry automatically.

[[source]]
name = "lexisnexis"
title = "LexisNexis (Accurint / Nexis)"
category = "people_search"
description = "Public records, legal research, news archives and identity data (US-centric)."
access = "enterprise"
cost = "Enterprise contract with permissible-purpose verification"
website = "https://www.lexisnexis.com/"
legal = "US: FCRA/GLBA/DPPA permissible purposes; strict credentialing."
reliability = "high"
capabilities = ["people records", "court records", "news archives", "corporate records"]
input_entities = ["person", "phone", "email", "organization"]
output_entities = ["person", "public_record", "organization", "location"]
status_note = "No public API documentation — available to contracted customers. Contact the provider."

