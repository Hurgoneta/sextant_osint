# Commercial data / intelligence providers, listed so the investigator knows they exist and what access looks like.
# They are catalog entries, not connectors: Sextant never queries them. A provider becomes queryable only through a
# connector configured with YOUR licence (then its status changes from "Connector interface only — contact provider").
#
# Metadata rules: data categories are worded as each provider describes its own offering on its public website, at a
# general level; nothing here claims that a provider sells a particular field about a particular person.
# `last_verified` is empty until someone checks the entry against the provider (Data Sources shows "Not verified").
# More providers: add them in the UI (+ Add source, provider type "commercial") or through Data Sources → Discover
# sources; this file is only the starting set.
#
# [source.commercial]
#   access_models    free · free_tier · trial · per_query · subscription · enterprise · manual
#   api              documented (public docs) · enterprise (for customers) · none · unknown
#   web_app          a web application exists
#   data_categories  as described by the provider (general)
#   limitations      what to keep in mind (legal regime, regional coverage, contract terms)

