# Health probes: one public test input per connector, run by `python -m sextant.tools.health_check`.
# Inputs are mascots and official accounts (octocat, library), example domains, public IPs, large listed companies,
# a generic placeholder name ("John Smith") or an invented handle (sextantprobe9q) that belongs to no one. They identify
# no person. Either "found" or "not_found" proves the source answered correctly; errors or refusals do not.
# slow = downloads a large dataset (sanctions lists); run only with --all.

[probe.github]
transform = "github.username_lookup"
entity = ["username", "octocat"]
[probe.gitlab]
transform = "gitlab.username_lookup"
entity = ["username", "sextantprobe9q"]
