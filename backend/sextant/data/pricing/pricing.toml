# Published prices used for cost ESTIMATES (the provider's invoice is authoritative). Editable in Settings → Pricing
# without code changes: an edit is stored as your override and wins over this file; "Reset AI settings" removes overrides.
#
#   provider        normalized provider identity (one per API account: every service using that account adds up)
#   service         what is priced: web_search, ai_chat, people_data, …
#   connector       the connector that uses this price (optional)
#   model           AI model id for token prices (optional; "*" = any model of the provider)
#   per_request     USD per request / query
#   input_per_mtok, output_per_mtok, cached_input_per_mtok, reasoning_per_mtok   USD per million tokens
#   effective_date  when the price took effect (as published)
#   source_url      where it was published
#   verified_date   when someone last checked it against the source ("" = not verified)
#
# A price that is not known is left out: the cost then shows as "Unknown", never as a guess.

[[price]]
provider = "brave"
service = "web_search"
connector = "brave_search"
per_request = 0.005
effective_date = "2026-02-01"
source_url = "https://brave.com/search/api/"
verified_date = ""
note = "$5 per 1,000 queries after a $5 monthly credit (≈1,000 queries). The credit is not deducted here."

