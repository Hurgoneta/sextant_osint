# Commercial intelligence providers, attached to each country they cover. They are listed so the investigator knows
# they exist; Sextant never bypasses payment. `access = "paid"` = subscription (some offer limited free web search).
# Where a Sextant connector exists, `connector` points to it ("Configure" in Data Sources).

[[regional]]
id = "com-northdata"
title = "North Data — company and officer data from European registers (premium / API)"
kind = "commercial_provider"
url = "https://www.northdata.com/"
access = "paid"
name_search = true
notes = "Free limited web search; history, networks, exports and API need a subscription."
countries = ["DE", "AT", "CH", "NL", "BE", "LU", "FR", "ES", "IT", "PL", "DK", "SE", "NO", "FI", "GB"]

