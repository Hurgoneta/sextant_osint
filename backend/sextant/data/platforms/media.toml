# Video, streaming, music, audio, photography and art.

[[platform]]
id = "youtube"
name = "YouTube"
category = "video"
url = "https://www.youtube.com"
profile_url = "https://www.youtube.com/@{username}"
hosts = ["youtube.com", "m.youtube.com"]
url_patterns = ['^(?:m\.)?youtube\.com/@([A-Za-z0-9_.-]{3,30})/?$', '^(?:m\.)?youtube\.com/(?:c|user)/([A-Za-z0-9_.-]{1,100})/?$']
username_pattern = '^[A-Za-z0-9_.-]{3,30}$'
api = "key"
extraction = ["display_name", "description", "country", "created_at", "avatar", "subscribers", "custom_url"]
auth = "free Google API key (YouTube Data API v3)"
rate_limit = "10,000 quota units/day; a handle lookup costs 1 unit"
check = "youtube"

[[platform]]
id = "twitch"
name = "Twitch"
category = "video"
url = "https://www.twitch.tv"
profile_url = "https://www.twitch.tv/{username}"
hosts = ["twitch.tv", "m.twitch.tv"]
url_patterns = ['^(?:m\.)?twitch\.tv/(?!directory|videos|settings|downloads|jobs|p/|search|subscriptions|inventory|wallet|drops)([A-Za-z0-9_]{4,25})/?$']
username_pattern = '^[A-Za-z0-9_]{4,25}$'
api = "key"
extraction = ["display_name", "description", "created_at", "avatar", "broadcaster_type"]
auth = "free client id + secret (app access token)"
check = "twitch"

