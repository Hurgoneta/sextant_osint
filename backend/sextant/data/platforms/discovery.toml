# Identity discovery targets: the platforms the web-search stage of the identity pipeline looks for
# (discovery/queries.py). Data, not code: add a platform here (it must exist in the platform registry, or be one of
# your own platforms with a profile-URL template) and the pipeline queries it, parses its profile URLs and pivots on
# the handles it finds.
#
#   platform      registry id
#   priority      0–1, how often ordinary people have a public, search-indexed profile there (orders the queries)
#   site          the `site:` filter (may include a path, e.g. linkedin.com/in)
#   countries     optional ISO-2 codes where the platform is especially common (boosts it for those investigations)
#   any_subpath   the first path segment is always the account (pinterest.com/<user>/<board>/, github.com/<user>/<repo>)
#
# Profile sub-pages (`subpages`) are trimmed before parsing, so a result such as pinterest.com/<user>/_saved/ or
# tiktok.com/@<user>/video/123 still yields the handle. These words never count as a username themselves.

subpages = ["_saved", "_created", "_profile", "boards", "pins", "followers", "following", "likes", "videos", "video",
            "about", "featured", "posts", "reels", "tagged", "repositories", "stars", "playlists", "shorts", "streams",
            "community", "photos", "with_replies", "media", "status", "photo", "favorites", "albums", "tracks",
            "sets", "reposts", "comments", "submitted", "overview", "gilded", "projects", "activity", "collections",
            "lists", "music", "friends", "info", "sk", "posts_and_replies"]

# First path segments that are content, never an account: a trimmed URL ending in one of these is not a profile
# (pinterest.com/pin/123/ is a pin, instagram.com/p/… a post, youtube.com/watch… a video).
not_handles = ["pin", "pins", "p", "reel", "reels", "tv", "stories", "explore", "video", "videos", "watch", "status",
               "hashtag", "tags", "tag", "search", "ideas", "today", "business", "i", "intent", "share", "topics", "c",
               "channel", "playlist", "shorts", "events", "groups", "pages", "marketplace", "photo", "photos", "post",
               "posts", "music", "sound", "discover", "trending", "live", "embed", "login", "signup", "help"]

