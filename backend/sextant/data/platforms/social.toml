url = "https://telegram.org"
profile_url = "https://t.me/{username}"
hosts = ["t.me", "telegram.me"]
url_patterns = ['^(?:t|telegram)\.me/(?!s/|joinchat|addstickers|share|\+)([A-Za-z0-9_]{5,32})/?$']
username_pattern = '^[A-Za-z][A-Za-z0-9_]{4,31}$'
public_profile = "partial"
check = "whatsmyname"
notes = "The public t.me page shows public usernames/channels; phone-number discovery is never used."

[[platform]]
id = "discord"
