[[platform]]
id = "pinterest"
name = "Pinterest"
category = "social"
url = "https://www.pinterest.com"
profile_url = "https://www.pinterest.com/{username}/"
hosts = ["pinterest.com", "pinterest.co.uk", "pinterest.ca", "pinterest.com.au", "pinterest.de", "pinterest.fr", "pinterest.es",
         "pinterest.it", "pinterest.at", "pinterest.ch", "pinterest.ie", "pinterest.nz", "pinterest.pt", "pinterest.se",
         "pinterest.dk", "pinterest.jp", "pinterest.com.mx", "pinterest.cl", "pinterest.ph", "pinterest.ru", "pinterest.co.kr"]
url_patterns = ['^(?:[a-z]{2}\.)?pinterest\.[a-z.]+/(?!pin/|search|ideas|today|business)([A-Za-z0-9_]{3,30})/?$']
username_pattern = '^[A-Za-z0-9_]{3,30}$'
api = "restricted"
check = "whatsmyname"
notes = "robots.txt disallows automated clients; skipped unless you disable robots.txt respect."

[[platform]]
id = "tumblr"
name = "Tumblr"
category = "microblogging"
url = "https://www.tumblr.com"
profile_url = "https://{username}.tumblr.com"
url_patterns = ['^([a-z0-9-]{1,32})\.tumblr\.com/?$', '^tumblr\.com/([a-z0-9-]{1,32})/?$']
username_pattern = '^[A-Za-z0-9-]{1,32}$'
api = "key"
check = "whatsmyname"

[[platform]]
id = "telegram"
name = "Telegram (public channels & usernames)"
