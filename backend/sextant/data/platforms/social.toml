# Social networks. `check` names the connector that checks existence:
#   a dedicated connector (official/public API) | "whatsmyname" (community rules, public profile page)
#   | "manual" (terms forbid automated access or login wall — the investigator opens the link).
# Regexes are TOML literal strings, matched against "host/path" (lower-cased host, no "www.").

[[platform]]
id = "x"
name = "X (Twitter)"
category = "microblogging"
url = "https://x.com"
profile_url = "https://x.com/{username}"
hosts = ["x.com", "twitter.com", "mobile.twitter.com"]
url_patterns = ['^(?:mobile\.)?(?:x|twitter)\.com/(?!home|search|i/|intent|share|hashtag|explore|settings|login|messages|notifications|compose|tos|privacy)([A-Za-z0-9_]{1,15})/?$']
username_pattern = '^[A-Za-z0-9_]{1,15}$'
api = "paid"
public_profile = "login_wall"
search_methods = ["username", "name"]
extraction = ["display_name", "bio", "location", "website", "created_at", "avatar", "followers"]
auth = "Bearer token (pay-per-use developer account)"
rate_limit = "pay-per-use (~$0.01 per user lookup, 2026)"
check = "x_api"
notes = "Profiles require login in a browser. Automated lookups only through the official paid API with your own developer account."

[[platform]]
id = "instagram"
name = "Instagram"
category = "social"
url = "https://www.instagram.com"
profile_url = "https://www.instagram.com/{username}/"
url_patterns = ['^instagram\.com/(?!p/|reel/|reels/|explore|accounts|stories|direct|about|developer|legal)([A-Za-z0-9_.]{1,30})/?$']
username_pattern = '^[A-Za-z0-9_.]{1,30}$'
api = "restricted"
public_profile = "login_wall"
extraction = ["display_name", "bio", "website", "avatar", "followers"]
auth = "Meta app + Instagram business account token (Business Discovery)"
check = "instagram_business"
notes = "Only public business/creator accounts via the Graph API Business Discovery endpoint; personal accounts cannot be looked up. Scraping and third-party mirrors are not used."

[[platform]]
id = "facebook"
name = "Facebook"
category = "social"
url = "https://www.facebook.com"
profile_url = "https://www.facebook.com/{username}"
hosts = ["facebook.com", "m.facebook.com", "fb.com"]
url_patterns = ['^(?:m\.)?facebook\.com/(?!pages/|groups/|events/|watch|marketplace|login|sharer|share|people/|profile\.php|help|policies|privacy|settings|gaming|reel/)([A-Za-z0-9.]{5,50})/?$']
username_pattern = '^[A-Za-z0-9.]{5,50}$'
api = "none"
public_profile = "login_wall"
check = "manual"
notes = "No lookup API; terms forbid automated access. Open the link yourself."

[[platform]]
id = "threads"
name = "Threads"
category = "microblogging"
url = "https://www.threads.com"
profile_url = "https://www.threads.com/@{username}"
hosts = ["threads.net", "threads.com"]
url_patterns = ['^threads\.(?:net|com)/@([A-Za-z0-9_.]{1,30})/?$']
username_pattern = '^[A-Za-z0-9_.]{1,30}$'
api = "restricted"
public_profile = "partial"
check = "manual"
notes = "The Threads API only returns the authorised user's own profile."

[[platform]]
id = "tiktok"
name = "TikTok"
category = "social"
url = "https://www.tiktok.com"
profile_url = "https://www.tiktok.com/@{username}"
url_patterns = ['^tiktok\.com/@([A-Za-z0-9_.]{2,24})/?$']
username_pattern = '^[A-Za-z0-9_.]{2,24}$'
api = "restricted"
public_profile = "partial"
check = "manual"
notes = "Research API limited to approved academic researchers; anti-bot protection on profile pages."

[[platform]]
id = "snapchat"
name = "Snapchat"
category = "social"
url = "https://www.snapchat.com"
profile_url = "https://www.snapchat.com/add/{username}"
url_patterns = ['^snapchat\.com/(?:add/|@)([A-Za-z0-9._-]{3,15})/?$']
username_pattern = '^[A-Za-z][A-Za-z0-9._-]{2,14}$'
public_profile = "partial"
check = "manual"
notes = "Terms prohibit automated access."

[[platform]]
id = "bluesky"
name = "Bluesky"
category = "microblogging"
url = "https://bsky.app"
profile_url = "https://bsky.app/profile/{username}.bsky.social"
url_patterns = ['^bsky\.app/profile/([A-Za-z0-9.-]{3,253})/?$']
username_pattern = '^[A-Za-z0-9][A-Za-z0-9-]{1,17}$'
api = "public"
search_methods = ["username", "name"]
extraction = ["display_name", "bio", "created_at", "avatar", "followers"]
rate_limit = "public AppView, generous"
check = "bluesky"
notes = "Custom-domain handles are resolved too when the handle is a domain."

[[platform]]
id = "mastodon"
name = "Mastodon / Fediverse"
category = "microblogging"
url = "https://joinmastodon.org"
profile_url = "https://mastodon.social/@{username}"
hosts = ["mastodon.social", "mastodon.online", "fosstodon.org", "hachyderm.io", "infosec.exchange", "mstdn.social", "mas.to", "techhub.social"]
url_patterns = ['^[a-z0-9.-]+/@([A-Za-z0-9_]{1,30})(?:@[a-z0-9.-]+)?/?$']
username_pattern = '^[A-Za-z0-9_]{1,30}$'
api = "public"
search_methods = ["username", "handle"]
extraction = ["display_name", "bio", "links", "verified_links", "created_at", "avatar", "followers"]
check = "mastodon"
notes = "Thousands of independent servers. A bare username is checked on a list of large servers; a full handle (user@server) is resolved by WebFinger on its own server. rel=me verified links are strong evidence."

[[platform]]
id = "pixelfed"
name = "Pixelfed"
category = "photography"
url = "https://pixelfed.social"
profile_url = "https://pixelfed.social/{username}"
api = "public"
check = "whatsmyname"

[[platform]]
