# Forums, blogs, gaming, identity/link pages, marketplaces, hobbies and regional platforms.

[[platform]]
id = "reddit"
name = "Reddit"
category = "forums"
url = "https://www.reddit.com"
profile_url = "https://www.reddit.com/user/{username}"
hosts = ["reddit.com", "old.reddit.com"]
url_patterns = ['^(?:old\.)?reddit\.com/(?:u|user)/([A-Za-z0-9_-]{3,20})/?']
username_pattern = '^[A-Za-z0-9_-]{3,20}$'
api = "restricted"
extraction = ["display_name", "bio", "created_at", "avatar", "karma"]
auth = "approved Reddit app (Responsible Builder Policy, Nov 2025)"
rate_limit = "100 requests/minute per OAuth client"
check = "reddit"
notes = "Unauthenticated API access returns 403; new API access requires Reddit's approval."

