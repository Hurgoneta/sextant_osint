check = "steam"

[[platform]]
id = "roblox"
name = "Roblox"
category = "gaming"
url = "https://www.roblox.com"
profile_url = "https://www.roblox.com/user.aspx?username={username}"
url_patterns = ['^roblox\.com/users/([0-9]{1,15})/profile/?$']
api = "public"
check = "probe"
probe = { url = "https://users.roblox.com/v1/usernames/users", method = "POST", body = "{\"usernames\":[\"{username}\"],\"excludeBannedUsers\":false}", list_path = "data", match = "name", fields = { display_name = "displayName", user_id = "id" }, docs = "https://create.roblox.com/docs/cloud/legacy/users/v1" }

