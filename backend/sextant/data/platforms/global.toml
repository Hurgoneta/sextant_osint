# Platform registry — global and regional platforms beyond the original set (social, messaging, video, music,
# podcasts, photography, art, writing, newsletters, professional, jobs, freelance, gaming, forums, Q&A, developer,
# packages, academic, education, dating, fitness, travel, books, film, reviews, marketplaces, creator, crowdfunding,
# events, identity, directories, reference, genealogy, adult).
#
# `check` says how Sextant checks a username: whatsmyname / maigret / sherlock = the community rule for the site
# exists in that dataset (data/platforms/imported/); probe = a documented public API declared in [platform.probe];
# manual = a link for the investigator (terms forbid automation, login wall, or no maintained rule);
# none = no public profiles exist (private messengers, dating apps) — nothing is ever accessed.
# public_profile: yes | partial | login_wall | none · public_search: can anyone search people there without login?
# private_accounts: the platform has private accounts (never accessed) · status: active | defunct

[[platform]]
id = "whatsapp"
name = "WhatsApp"
category = "messaging"
url = "https://www.whatsapp.com"
api = "restricted"
api_requirements = "WhatsApp Business Platform: messages with your own business number only; no lookup of other users"
public_profile = "none"
private_accounts = true
check = "none"
notes = "Private messaging service: accounts, contacts, groups and messages are not public and are never accessed. Only WhatsApp Channels opened from public invite links are public."

