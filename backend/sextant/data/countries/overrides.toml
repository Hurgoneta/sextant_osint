# Curated overrides applied by `python -m sextant.tools.import_datasets countries` on top of the UN M49 table and
# Wikidata. The generated list is data/countries/countries.json: 193 UN member states + the Holy See and the
# State of Palestine (UN observer states) = 195 sovereign states, plus the territories below. Territories are
# listed because they run their own registers (company, court, domain), and they are never counted in the 195.

# Short names used in the UI (the M49 name is kept as an alias)
[names]
NR = "Nauru"
BO = "Bolivia"
BN = "Brunei"
CG = "Republic of the Congo"
CI = "Côte d'Ivoire"
FM = "Micronesia"
GB = "United Kingdom"
IR = "Iran"
KP = "North Korea"
KR = "South Korea"
LA = "Laos"
MD = "Moldova"
NL = "Netherlands"
RU = "Russia"
SY = "Syria"
TZ = "Tanzania"
US = "United States"
VE = "Venezuela"
VN = "Vietnam"
HK = "Hong Kong"
MO = "Macao"
VG = "British Virgin Islands"

# Investigation regions differ from M49 where OSINT practice groups countries differently
[regions]
MX = "North America"
AM = "Europe"
AZ = "Europe"
GE = "Europe"
CY = "Europe"
TR = "Europe"
IR = "Middle East"

[subregions]
AM = "Caucasus"
AZ = "Caucasus"
GE = "Caucasus"
CY = "Eastern Mediterranean"
TR = "Southeast Europe / Western Asia"

[tld]
GB = ".uk"
XK = ""

# FIPS 10-4 codes missing from Wikidata (GDELT filters news by FIPS code; Palestine = West Bank)
[fips]
NL = "NL"
PS = "WE"

# Official languages missing from Wikidata (ISO 639-1; used for local-language search)
[languages]
CN = ["zh"]
GR = ["el"]
UY = ["es"]
BF = ["fr"]
ME = ["sr"]
GI = ["en"]
HK = ["zh", "en"]
TW = ["zh"]
MO = ["zh", "pt"]

