[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sextant"
version = "0.2.0"
description = "Local-first OSINT investigation platform: transforms, entity resolution, evidence graph, provenance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27,<1", "httpcore>=1.0", "dnspython>=2.6", "phonenumbers>=8.13",
  "cryptography>=42", "jinja2>=3.1", "pydantic>=2.6", "tldextract>=5.1", "certifi", "defusedxml>=0.7",
]

[project.optional-dependencies]
images = ["pillow>=10"]          # perceptual hashes of profile photos (avatar correlation)
ai = ["anthropic>=1.11,<2"]      # the Claude provider of the AI assistant (OpenAI-compatible endpoints need nothing)
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
sextant = "sextant.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
sextant = ["reporting/templates/*.html", "data/**/*.toml", "data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q -m 'not live'"
markers = ["live: hits real public APIs (opt-in: pytest -m live)"]
filterwarnings = ["ignore::DeprecationWarning:tldextract.*"]
